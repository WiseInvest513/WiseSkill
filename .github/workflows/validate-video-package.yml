name: Validate portable video package
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check-package.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s skills/wise-video/tests -v
