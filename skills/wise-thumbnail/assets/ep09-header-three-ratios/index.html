(async()=>{
const q=new URLSearchParams(location.search),ratio=q.get('ratio')||'16x9',portrait=ratio==='3x4',wide=ratio==='16x9';
const response=await fetch(q.get('content')||'example-ep10.json');if(!response.ok)throw new Error('Cannot load cover content');const data=await response.json(),v=data.variants[ratio];if(!v)throw new Error('Missing ratio content');
