<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WiseInvest · 固定片尾</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#20354b;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1280px;margin:30px auto;padding:0 20px}h1{font-size:24px;font-weight:600;margin:0 0 18px}.viewport{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:#fffdf8;border-radius:12px;box-shadow:0 12px 35px #243d5214}iframe{border:0;width:1920px;height:1080px;position:absolute;left:0;top:0;transform-origin:0 0}.controls{display:flex;gap:14px;align-items:center;margin-top:18px}button{font:inherit;padding:9px 20px;border:1px solid #d4c3a5;background:#fffdfa;border-radius:8px;color:#20354b;cursor:pointer}input{flex:1;accent-color:#a6844b}output{font-variant-numeric:tabular-nums;font-size:14px;min-width:106px;text-align:right}p{color:#687686;font-size:13px;line-height:1.8}</style></head><body><main><h1>WiseInvest · 固定片尾</h1><div class="viewport"><iframe src="index.html" title="WiseInvest · 固定片尾"></iframe></div><div class="controls"><button id="play" type="button">播放</button><button id="replay" type="button">重播</button><input id="seek" type="range" aria-label="播放进度" min="0" max="35.034" step="0.001" value="0"><output>0.00 / 35.034 秒</output></div><p>无声模板预览。使用本期录音与字幕时，按语句重新对齐时间。</p></main><script>
const frame=document.querySelector('iframe'),view=document.querySelector('.viewport'),seek=document.querySelector('#seek'),play=document.querySelector('#play'),out=document.querySelector('output');const duration=35.034;let tl,playing=false,t=0,last=0;const fit=()=>frame.style.transform='scale('+view.clientWidth/1920+')';new ResizeObserver(fit).observe(view);fit();
function paint(value){t=Math.min(duration,Math.max(0,value));if(!tl)return;tl.seek(t,false);frame.contentDocument.querySelectorAll('.clip[data-start]').forEach(el=>{const start=Number(el.dataset.start),end=start+Number(el.dataset.duration);el.style.visibility=t>=start&&t<end?'visible':'hidden';});seek.value=t;out.textContent=t.toFixed(2)+' / '+duration.toFixed(3)+' 秒';}
function pause(){playing=false;play.textContent='播放';}
function step(now){if(!playing)return;const delta=(now-last)/1000;last=now;paint(t+delta);if(t>=duration){pause();return;}requestAnimationFrame(step);}
function start(){if(!tl)return;if(t>=duration)paint(0);playing=true;play.textContent='暂停';last=performance.now();requestAnimationFrame(step);}
play.onclick=()=>playing?pause():start();document.querySelector('#replay').onclick=()=>{pause();paint(0);start();};seek.oninput=()=>{pause();paint(Number(seek.value));};frame.onload=()=>{const timelines=frame.contentWindow.__timelines||{};tl=timelines['srt-video'];if(!tl){out.textContent='模板未能加载';return;}tl.pause();paint(0);};window.templatePreview={seek:paint,pause,get time(){return t},get ready(){return !!tl}};
</script></body></html>
