const canvas=document.getElementById('motion'),ctx=canvas.getContext('2d');const rad=Math.PI/180,cx=1640,cy=470,R=414;

function buildLandLights(){
const probe=document.createElement('canvas');probe.width=surface.naturalWidth;probe.height=surface.naturalHeight;const pc=probe.getContext('2d',{willReadFrequently:true});pc.drawImage(surface,0,0);const data=pc.getImageData(0,0,probe.width,probe.height).data;
function isLand(lon,lat){const x=Math.floor((lon+180)/360*probe.width),y=Math.floor((90-lat)/180*probe.height);for(const [dx,dy] of [[0,0],[-3,0],[3,0],[0,-3],[0,3]]){const xx=Math.max(0,Math.min(probe.width-1,x+dx)),yy=Math.max(0,Math.min(probe.height-1,y+dy)),j=(yy*probe.width+xx)*4;const lum=(data[j]*.299+data[j+1]*.587+data[j+2]*.114)/255;if(lum<.825)return false;}return true;}
